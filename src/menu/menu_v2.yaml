# ===========================================
# ЛЕГЕНДА
# -------------------------------------------
# Узлы:
# - id:            строковый уникальный идентификатор (латиница/цифры/подчёрки), станет MENU_<ID>
# - type:          submenu | value | toggle | action
# - title:         {ru: "...", en: "...", ...}
# - unit:          {ru: "...", en: "..."}       - опционально для value/toggle
# - vtype:         float | uint16 | uint8 | int32 | bool
# - min/max/step:  числовые границы/шаг
# - bind:          имя переменной в прошивке
# - persist:       true/false
# - default:       значение по умолчанию
# - on_change:     имя функции (void fn(void* ptr))
# - on_invoke:     имя функции (void fn(void))
# - apply:         "live" - применять сразу
# - children:      массив вложенных узлов
# - scope:         глобальная или локальная для каждого контроллера
# ===========================================

# ===========================================
# ЛЕГЕНДА
# + scope: global | per_controller
# ===========================================
# ===========================================
# ГЕНЕРАЦИЯ
# source .venv/bin/activate
# python src/menu/generator/gen_menu_v2.py src/menu/menu_v2.yaml --out src/menu
# ===========================================

- id: root
  type: submenu
  title: { ru: "МЕНЮ", en: "MENU" }
  children:
    # --- КОНТРОЛЛЕР (ГЛОБАЛЬНО) ---
    - id: controller_choice
      type: value
      title: { ru: "КОНТРОЛЛЕР", en: "CONTROLLER" }
      vtype: uint8
      min: 0
      max: 2
      step: 1
      bind: number_controller
      persist: true
      scope: global
      default: 0
      on_change: set_active_controller

    # --- СУШКА (ПО КОНТРОЛЛЕРАМ) ---
    - id: drying
      type: submenu
      title: { ru: "СУШКА", en: "DRYING" }
      scope: per_controller
      children:
        - id: dry_temp
          type: value
          title: { ru: "ТЕМПЕРАТУРА", en: "TEMPERATURE" }
          unit: { ru: "°C", en: "°C" }
          vtype: float
          min: 30
          max: 110
          step: 1
          bind: dry_temp
          persist: true
          default: 60.0

        - id: dry_time
          type: value
          title: { ru: "ВРЕМЯ", en: "TIME" }
          unit: { ru: "мин", en: "min" }
          vtype: uint16
          min: 0
          max: 600
          step: 1
          bind: dry_time
          persist: true
          default: 240

        - id: dry_start
          type: action
          title: { ru: "СТАРТ", en: "START" }
          on_invoke: start_drying

    # --- ХРАНЕНИЕ (ПО КОНТРОЛЛЕРАМ) ---
