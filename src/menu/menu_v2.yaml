              persist: true
              default: 20
              on_change: on_servo_preview
            - id: servo_open_angle
              type: value
              title: { ru: "ОТКРЫТО УГОЛ", en: "OPEN ANGLE" }
              unit: { ru: "°", en: "°" }
              vtype: uint8
              min: 0
              max: 180
              step: 1
              bind: servo_open_angle
              persist: true
              default: 50
              on_change: on_servo_preview

            - id: servo_time_closed
              type: value
              title: { ru: "ВРЕМЯ ЗАКРЫТО", en: "CLOSED TIME" }
              unit: { ru: "с", en: "s" }
              vtype: uint16
              min: 0
              max: 3600
              step: 1
              bind: servo_time_closed
              persist: true
              default: 600

            - id: servo_time_open
              type: value
              title: { ru: "ВРЕМЯ ОТКРЫТО", en: "OPEN TIME" }
              unit: { ru: "с", en: "s" }
              vtype: uint16
              min: 0
              max: 600
              step: 1
              bind: servo_time_open
              persist: true
              default: 30

            - id: servo_smart_mode
              type: toggle
              title: { ru: "УМНЫЙ РЕЖИМ", en: "SMART MODE" }
              vtype: bool
              bind: servo_smart_mode
              persist: true
              default: false

    - id: global_settings
      type: submenu
      title: { ru: "ОБЩИЕ", en: "GLOBAL" }
      children:
        - id: piortal
          type: submenu
          title: { ru: "ПОРТАЛ", en: "PORTAL" }
          children:
            - id: start_claim
              type: action
              title: { ru: "СВЯЗАТЬ", en: "CLAIM" }
              on_invoke: start_claim

            # --- БЛОКИРОВКА КОМАНД (ГЛОБАЛЬНО) ---
            # Source of truth для remote-control gate. ESP-мост подхватывает
            # значение из UART Status и зеркалит в SDK через setIgnoreExternalCmd.
            - id: ignore_external_cmd
              type: toggle
              title: { ru: "ИГНОР КОМАНД", en: "IGNOR EXT CMD" }
              vtype: bool
              bind: ign_ext_cmd
              role: system.ignore_external_cmd
              persist: true
              scope: global
              default: false

        - id: session_count
          type: submenu
          title: { ru: "СЧЕТЧИК СЕССИЙ", en: "SESSION COUNTER" }
          children:
            - id: drying_session_count
              type: value
              title: { ru: "СУШКА", en: "DRYING" }
              vtype: uint16
              min: 0
              max: 65535
              step: 1
              bind: drying_session_count
              persist: true
              scope: global
              default: 0

            - id: storage_session_count
              type: value
              title: { ru: "ХРАНЕНИЕ", en: "STORAGE" }
              vtype: uint16
              min: 0
              max: 65535
              step: 1
              bind: storage_session_count
              persist: true
              scope: global
              default: 0

            - id: profile_session_count
              type: value
              title: { ru: "ПРОФИЛЬ", en: "PROFILE" }
              vtype: uint16
              min: 0
              max: 65535
              step: 1
              bind: profile_session_count
              persist: true
              scope: global
              default: 0

        #* --- КОНФИГУРАЦИЯ ПОРТОВ (ГЛОБАЛЬНО) ---
        - id: hardware_config
          type: submenu
          title: { ru: "КОНФИГУРАЦИЯ ПОРТОВ", en: "PORT CONFIG" }
          scope: global
          children:
            - id: port1_mode
              type: value
              title: { ru: "ПОРТ 1", en: "PORT 1" }
              vtype: uint8
              min: 0
              max: 3
              step: 1
              bind: port1_mode
              persist: true
              scope: global
              default: 2 # SCALES

            - id: port2_mode
              type: value
              title: { ru: "ПОРТ 2", en: "PORT 2" }
              vtype: uint8
              min: 0
              max: 3
              step: 1
              bind: port2_mode
              persist: true
              scope: global
              default: 3 # LINK

            - id: port3_mode
              type: value
              title: { ru: "ПОРТ 3", en: "PORT 3" }
              vtype: uint8
              min: 0
              max: 3
              step: 1
              bind: port3_mode
              persist: true
              scope: global
              default: 1 # SCREEN

        # --- WEBSOCKET LOCAL ACCESS (ГЛОБАЛЬНО) ---
        - id: ws_local
          type: submenu
          title: { ru: "WS ЛОКАЛЬНЫЙ", en: "WS LOCAL" }
          children:
            - id: ws_enabled
              type: toggle
              title: { ru: "ВКЛ/ВЫКЛ", en: "ON/OFF" }
              vtype: bool
              bind: ws_enabled
              persist: true
              scope: global
              default: false
              on_change: ws_toggle

        #* --- КОЛ-ВО ЮНИТОВ (ГЛОБАЛЬНО) --- ВСЕГДА ПЕРДПОСЛЕДЕДНИЙ ---
        - id: units_count
          type: value
          title: { ru: "КОЛ-ВО ЮНИТОВ", en: "UNITS" }
          vtype: uint8
          min: 1
          max: 3 # NUM_UNITS=3
          step: 1
          bind: units_count
          persist: true
          scope: global
          default: 1
          on_change: units_count_set

        #* --- ЯЗЫК (ГЛОБАЛЬНО) --- ВСЕГДА ПОСЛЕДНИЙ ---
        - id: language
          type: value
          title: { ru: "ЯЗЫК", en: "LANGUAGE" }
          vtype: uint8
          min: 0
          max: 1
          step: 1
          bind: language
          persist: true
          scope: global
          default: 1
          on_change: on_language_changed
          apply: live
