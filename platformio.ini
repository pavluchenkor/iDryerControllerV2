; https://arduino-pico.readthedocs.io/en/latest/multicore.html
[platformio]
default_envs = pico_0x44, pico_0x45

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; LittleFS-раздел 1 МБ — нужен PicoOTA: сюда складывается /firmware.bin +
; /otacommand.bin. Активирует встроенный OTA-loader в первых 12 КБ flash
; (Earle Philhower core). См. ___OTA_MQTT_DESIGN.md «OTA для RP2040».
; ⚠ Первая раскатка OTA-aware прошивки — только через USB BOOTSEL: меняется
;   partition layout. EEPROM сохраняется (адрес независим от LittleFS).
board_build.filesystem_size = 1m

upload_port = /dev/cu.usbmodem114401
monitor_port = /dev/cu.usbmodem114401
upload_protocol = picotool
upload_flags = -f

lib_deps =
  olikraus/U8g2@^2
  khoih-prog/RP2040_Slow_PWM
  RobTillaart/SHT31
  adafruit/Adafruit NeoPixel
; required for iDryer protocol  
  bblanchon/ArduinoJson@^6.21.3
  knolleary/PubSubClient@^2.8

lib_ldf_mode = deep+
lib_ignore = WebSockets
build_flags =
  -DUSE_TINYUSB
  -DPICO_TINYUSB
  -DNFC_INTERFACE_SPI
  -I"$PROJECT_LIBDEPS_DIR/pico/u8g2/csrc"
  -I"$PROJECT_LIBDEPS_DIR/pico/u8g2/cppsrc"
  -I"$PROJECT_LIBDEPS_DIR/pico/Adafruit TinyUSB Library/src"
  -DPICO_XOSC_STARTUP_DELAY_MULTIPLIER=64
  -DSERIAL_RX_BUFFER_SIZE=512
  ; -DHAL_NO_LOG

extra_scripts = post:scripts/post_build.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 1

monitor_filters = log2file ;time

[env:pico_0x44]
build_flags =
  ${env.build_flags}
  -DSHT31_ADDRESS=0x44
  -DHW_CTRL=\"rp2040-v1-44\"
  -DDEBUG_LOG=1  ; ВРЕМЕННО: диагностика OTA-proxy (overflow/flash). Убрать после.

[env:pico_0x45]
build_flags =
  ${env.build_flags}
  -DSHT31_ADDRESS=0x45
  -DHW_CTRL=\"rp2040-v1-45\"
